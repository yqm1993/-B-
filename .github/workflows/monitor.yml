name: B站动态监控

on:
  schedule:
    # 每 10 分钟检查一次（GitHub 的 cron 用 UTC，但对本任务无影响）
    # 注意：GitHub 排队繁忙时可能延迟几分钟，属正常现象
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # 允许在网页上手动点运行

# 允许把 seen.json 状态提交回仓库
permissions:
  contents: write

concurrency:
  group: bili-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行监控
        env:
          BILI_UID: ${{ vars.BILI_UID }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ vars.BARK_SERVER }}
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: python monitor.py

      - name: 保存已推送记录
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "bili-monitor-bot"
            git config user.email "bot@users.noreply.github.com"
            git add seen.json
            git commit -m "update seen state [skip ci]"
            git push
          else
            echo "状态无变化，无需提交。"
          fi
